<ion-header>
  <ion-toolbar>
    <ion-title>Register</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-item>
    <ion-input
      [(ngModel)]="email"
      placeholder="Email">
    </ion-input>
  </ion-item>

  <ion-item>
    <ion-input
      [(ngModel)]="password"
      type="password"
      placeholder="Password">
    </ion-input>
  </ion-item>

  <ion-button
    expand="block"
    (click)="register()">

    Register

  </ion-button>

</ion-content>
